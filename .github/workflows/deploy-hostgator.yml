name: Deploy na HostGator

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-midias-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Gerar e publicar site
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar TypeScript
        run: npm run lint

      - name: Gerar site de produção
        run: npm run build

      - name: Publicar na HostGator por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HOSTGATOR_FTP_SERVER }}
          username: ${{ secrets.HOSTGATOR_FTP_USERNAME }}
          password: ${{ secrets.HOSTGATOR_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.HOSTGATOR_FTP_DIRECTORY }}
          state-name: .ftp-deploy-vm-midias.json
          log-level: standard
          timeout: 120000
